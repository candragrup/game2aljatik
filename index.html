<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petualangan Informatika 2</title>
<style>
:root{--ink:#1d2340;--sun:#ffc93c;--mint:#22c3a6;--paper:#fffaf0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(#7fb8e6,#ffe6c4);font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);padding:16px}
.card{background:var(--paper);border-radius:28px;box-shadow:0 18px 50px rgba(29,35,64,.25);max-width:520px;width:100%;padding:32px 28px;text-align:center}
.tag{display:inline-block;background:var(--ink);color:var(--sun);font-weight:800;font-size:13px;letter-spacing:.08em;padding:6px 14px;border-radius:99px}
h1{font-size:34px;margin:16px 0 6px}p{margin:6px 0;color:#4a5078}
a.go{display:block;margin:22px 0 10px;background:var(--mint);color:#fff;text-decoration:none;font-size:26px;font-weight:800;padding:18px;border-radius:18px;box-shadow:0 6px 0 #159a83}
a.go:active{transform:translateY(4px);box-shadow:0 2px 0 #159a83}
.qr{margin-top:18px;display:flex;gap:14px;align-items:center;justify-content:center;text-align:left}.qr img{width:110px;height:110px;image-rendering:pixelated;border-radius:8px;background:#fff;padding:6px}
small{display:block;margin-top:18px;color:#7a7f9e}
</style></head><body><main class="card">
<span class="tag">INFORMATIKA KELAS 2 · BAB 3</span>
<h1>Petualangan Informatika</h1>
<p>Klik tombol di bawah untuk mulai bermain.</p>
<a class="go" href="https://claude.ai/artifact/7i6nQMxuTS35hcFx8DDMNb">Main Sekarang</a>
<p id="st">Game akan terbuka otomatis dalam <b id="n">3</b> detik…</p>
<div class="qr"><div id="qr" style="background:#fff;padding:6px;border-radius:8px;width:122px;height:122px"></div><p>Main di HP?<br>Pindai barcode ini<br>dengan kamera HP.</p></div>
<small>Pembuat: Candra Wahyudi, S.Pd.</small>
</main>
<script>let n=3;const t=setInterval(()=>{n--;document.getElementById('n').textContent=n;if(n<=0){clearInterval(t);location.href="https://claude.ai/artifact/7i6nQMxuTS35hcFx8DDMNb";}},1000);</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>try{new QRCode(document.getElementById("qr"),{text:"https://claude.ai/artifact/7i6nQMxuTS35hcFx8DDMNb",width:110,height:110});}catch(e){}</script></body></html>
